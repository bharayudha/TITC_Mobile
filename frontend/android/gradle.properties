org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compiler crashes on Windows when the project drive (D:)
# differs from the Gradle/Pub cache drive (C:) — relativize() throws on
# cross-drive paths. Disabling incremental compilation avoids it.
kotlin.incremental=false
