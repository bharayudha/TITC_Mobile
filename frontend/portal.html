.menu-tombol-khusus a {
    background-color: #ffffff;
    color: #000000; /* Penting agar warna teks menimpa default */
    padding: 10px 20px;
    border-radius: 25px; /* Untuk sudut membulat */
    font-weight: bold;
    text-decoration: none;
}
.menu-tombol-khusus a:hover {
    background-color: #ffffff;
}
/* Smooth Pulse + Glow Premium */
@keyframes premiumPulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4);
  }

  40% {
    transform: scale(1.08);
    box-shadow: 0 0 0 12px rgba(37, 211, 102, 0);
  }

  70% {
    transform: scale(1.04);
    box-shadow: 0 0 0 6px rgba(37, 211, 102, 0);
  }

  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
  }
}

/* Class utama */
.pulse-glow {
  display: inline-block;
  border-radius: 999px; /* biar bulat untuk WA style */
  animation: premiumPulse 2.5s ease-in-out infinite;
  transition: all 0.3s ease;
}
KODE ZOOM HOVER
/* ================================
   PREMIUM ZOOM - STABLE VERSION
   ================================ */

.zoom-premium {
  position: relative;
  display: inline-block;
  overflow: hidden;
  border-radius: 20px;
}

/* gambar */
.zoom-premium img {
  width: 100%;
  height: auto;
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              filter 0.4s ease;
  will-change: transform;
}

/* HANYA zoom (hapus translate biar tidak getar) */
.zoom-premium:hover img {
  transform: scale(1.08);
  filter: brightness(1.05);
}

}

#wap-admin{

<script>

const btn=document.getElementById("wap-button");
const box=document.getElementById("wap-box");
const overlay=document.getElementById("wap-overlay");

btn.onclick=()=>{box.style.display="block";overlay.style.display="block";}
overlay.onclick=()=>{box.style.display="none";overlay.style.display="none";}

function updateStatus(){
let h=new Date().getHours();
let dot=document.getElementById("wap-dot");
let text=document.getElementById("wap-status");

if(h>=8 && h<21){
dot.style.background="#22c55e";
text.innerHTML="Online";
}
else if(h==7){
dot.style.background="#f59e0b";
text.innerHTML="Online soon";
}
else{
dot.style.background="#ef4444";
text.innerHTML="Offline";
}
}

function updateAdmin(){
let h=new Date().getHours();
let img=document.getElementById("wap-admin");
let a1="https://titc.or.id/wp-content/uploads/2026/03/7.png";
let a2="https://titc.or.id/wp-content/uploads/2026/03/8.png";

if(h>=8 && h<15) img.src=a1;
else img.src=a2;
}

updateStatus();
updateAdmin();

function wapSend(){

let name=document.getElementById("wap_name").value;
